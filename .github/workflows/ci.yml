name: CI

on:
  push:
    branches:
      - main
  # SECURITY: keep this as `pull_request`, never `pull_request_target`.
  # `pull_request` runs fork PRs in the fork's context with a read-only token and
  # an isolated (merge-ref-scoped) cache, so a malicious PR cannot poison the
  # dependency cache that `main` restores. `pull_request_target` would run
  # untrusted PR code in the base repo's context and reintroduce that attack.
  pull_request:
    branches:
      - main

# Least privilege by default: jobs only get read access unless they opt into more.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes and avoid stale results.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # Required to checkout the code
      contents: read
      # Required to put a comment into the pull-request
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GITHUB_TOKEN in .git/config; this job never pushes.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check (Biome ci)
        run: pnpm run ci

      - name: Build
        run: pnpm run build

      - name: Type check
        run: pnpm run typecheck

      # Type-check test files (specs, fixtures, helpers), which are excluded from the build
      # tsconfigs above. Must run after Build: cli/extension resolve @eligian/language via its output.
      - name: Type check tests
        run: pnpm run typecheck:tests

      # Effect LSP diagnostics (errors + warnings fail the build via --strict).
      # Must run after Build so Langium-generated sources exist; invisible to
      # tsc/Biome so CI is the only automated gate for these findings.
      - name: Effect LSP diagnostics
        run: pnpm run effect:check

      # Every example must check cleanly (examples that demonstrate errors are
      # excluded in the script); problems show as pull-request annotations
      - name: Check examples (eligian check)
        run: pnpm run check:examples --format github

      # Every example's timelines must play on the real engine (jsdom) without
      # runtime failures; they show as pull-request annotations
      - name: Play examples (eligian smoke)
        run: pnpm run smoke:examples --format github

      - name: Run tests with coverage
        run: pnpm run test:coverage:ci

      - name: Report Coverage
        # Run even if tests fail to see coverage of failing tests
        if: always()
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        with:
          # Show coverage only for changed files to reduce noise
          file-coverage-mode: changes
          name: 'Coverage Report'
          json-summary-path: 'packages/language/coverage/coverage-summary.json'
          json-final-path: 'packages/language/coverage/coverage-final.json'
          vite-config-path: 'packages/language/vitest.config.ts'

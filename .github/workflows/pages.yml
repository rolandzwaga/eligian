name: Deploy Eligian Tour to GitHub Pages

# Compiles examples/eligian-tour into a standalone bundle with the CLI and
# publishes it as the repository's GitHub Pages site. Runs when the tour or the
# toolchain that compiles it changes, and on demand.
on:
  push:
    branches:
      - main
    paths:
      - 'examples/eligian-tour/**'
      - 'packages/cli/**'
      - 'packages/language/**'
      - 'packages/shared-utils/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege by default: jobs only get read access unless they opt into more.
permissions:
  contents: read

# One deployment at a time; don't cancel a deployment that is in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build tour bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GITHUB_TOKEN in .git/config; this job never pushes.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only the CLI and the workspace packages it depends on (not the extension).
      - name: Build CLI
        run: pnpm --filter "@eligian/cli..." build

      - name: Bundle the tour
        run: node packages/cli/bin/cli.js examples/eligian-tour/tour.eligian --bundle -o "$RUNNER_TEMP/site"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      # Required to deploy to GitHub Pages
      pages: write
      # Required to verify the deployment originates from this workflow
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

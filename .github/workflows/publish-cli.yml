name: Publish CLI

# Publishes the CLI (packages/cli) to npm as `eligian` with trusted publishing:
# GitHub's OIDC token is exchanged for a short-lived npm credential, so no
# access token is stored anywhere, and npm adds a provenance attestation. The
# package's trusted publisher on npmjs.com names this repository and this file
# (publish-cli.yml), without an environment: renaming the file breaks
# publishing.
#
# Run it by hand from the Actions tab, on main. The version is the one in
# packages/cli/package.json; bump it there first (a version can be published
# once). The very first version was published by hand: npm attaches a trusted
# publisher to an existing package.
#
# After the publish, a second job (the only one that may write to the
# repository) tags the commit cli-v<version> and creates a GitHub Release with
# the published tarball attached.
on:
  workflow_dispatch:

permissions:
  contents: read

# Never two publishes at once
concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only what is on main gets published
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      # Trusted publishing: the OIDC token npm exchanges for a publish credential
      id-token: write

    outputs:
      version: ${{ steps.pack.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # No registry-url: setup-node would write an .npmrc that expects
      # NODE_AUTH_TOKEN, and npm prefers a token over trusted publishing
      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      # Trusted publishing needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      # pnpm pack runs prepack (the minified production build) and replaces
      # the workspace: ranges; the tarball is what gets published
      - name: Pack
        id: pack
        working-directory: packages/cli
        run: |
          pnpm pack
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      # The package as a user gets it: installed from the tarball, its
      # dependencies from the registry, run on the examples
      - name: Try the package
        run: |
          npm install -g ./packages/cli/eligian-*.tgz
          eligian --version
          # As pnpm run check:examples: the error examples are left out
          eligian check "examples/**/*.eligian" "!examples/libraries/errors/**" "!examples/libraries/nested/cycle-*.eligian" --max-warnings 0
          eligian smoke "examples/eligian-tour/*.eligian"

      - name: Publish
        working-directory: packages/cli
        run: npm publish ./eligian-*.tgz

      # The tarball npm got, for the GitHub Release
      - name: Keep the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eligian-tarball
          path: packages/cli/eligian-*.tgz
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      # Create the cli-v<version> tag and the release
      contents: write

    steps:
      - name: Get the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eligian-tarball

      # Notes: where to get it, then the pull requests since the previous CLI
      # release (none before the first one)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          previous=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^cli-v' | head -n 1 || true)
          cat > notes.md <<EOF
          The \`eligian\` command, version $VERSION, on npm: https://www.npmjs.com/package/eligian/v/$VERSION

          \`\`\`bash
          npm install -g eligian@$VERSION
          \`\`\`

          Changes: [CHANGELOG.md](https://github.com/$GH_REPO/blob/cli-v$VERSION/CHANGELOG.md)
          EOF
          generated=()
          if [ -n "$previous" ]; then
            generated=(--generate-notes --notes-start-tag "$previous")
          fi
          gh release create "cli-v$VERSION" eligian-*.tgz \
            --target "$GITHUB_SHA" \
            --title "eligian CLI $VERSION" \
            --notes-file notes.md \
            "${generated[@]}"

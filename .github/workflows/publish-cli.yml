name: Publish CLI

# Publishes the CLI (packages/cli) to npm as `eligian` with trusted publishing:
# GitHub's OIDC token is exchanged for a short-lived npm credential, so no
# access token is stored anywhere, and npm adds a provenance attestation. The
# package's trusted publisher on npmjs.com names this repository and this file
# (publish-cli.yml), without an environment: renaming the file breaks
# publishing.
#
# Run it by hand from the Actions tab, on main. The version is the one in
# packages/cli/package.json; bump it there first (a version can be published
# once). The very first version was published by hand: npm attaches a trusted
# publisher to an existing package.
on:
  workflow_dispatch:

permissions:
  contents: read

# Never two publishes at once
concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only what is on main gets published
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      # Trusted publishing: the OIDC token npm exchanges for a publish credential
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No registry-url: setup-node would write an .npmrc that expects
      # NODE_AUTH_TOKEN, and npm prefers a token over trusted publishing
      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      # Trusted publishing needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      # pnpm pack runs prepack (the minified production build) and replaces
      # the workspace: ranges; the tarball is what gets published
      - name: Pack
        working-directory: packages/cli
        run: pnpm pack

      # The package as a user gets it: installed from the tarball, its
      # dependencies from the registry, run on the examples
      - name: Try the package
        run: |
          npm install -g ./packages/cli/eligian-*.tgz
          eligian --version
          # As pnpm run check:examples: the error examples are left out
          eligian check "examples/**/*.eligian" "!examples/libraries/errors/**" "!examples/libraries/nested/cycle-*.eligian" --max-warnings 0
          eligian smoke "examples/eligian-tour/*.eligian"

      - name: Publish
        working-directory: packages/cli
        run: npm publish ./eligian-*.tgz

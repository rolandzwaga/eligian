name: Publish CLI

# Publishes the CLI (packages/cli) to npm as `eligian` with trusted publishing:
# GitHub's OIDC token is exchanged for a short-lived npm credential, so no
# access token is stored anywhere, and npm adds a provenance attestation. The
# package's trusted publisher on npmjs.com names this repository and this file
# (publish-cli.yml), without an environment: renaming the file breaks
# publishing.
#
# Run it by hand from the Actions tab, on main. The version is the one in
# packages/cli/package.json; bump it there first (a version can be published
# once). The very first version was published by hand: npm attaches a trusted
# publisher to an existing package.
#
# After the publish, a second job (the only one that may write to the
# repository) tags the commit cli-v<version> and creates a GitHub Release with
# the published tarball attached.
#
# After npm, server.json (packages/cli) goes to the MCP registry with the same
# OIDC token (mcp-publisher, pinned by tag and checksum). If only that step
# failed, re-run with registry_only: it skips npm and the release.
on:
  workflow_dispatch:
    inputs:
      registry_only:
        description: 'Only publish server.json to the MCP registry (npm already has this version)'
        type: boolean
        default: false

permissions:
  contents: read

# Never two publishes at once
concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only what is on main gets published
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      # Trusted publishing: the OIDC token npm exchanges for a publish credential
      id-token: write

    outputs:
      version: ${{ steps.pack.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No registry-url: setup-node would write an .npmrc that expects
      # NODE_AUTH_TOKEN, and npm prefers a token over trusted publishing
      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      # Trusted publishing needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        if: ${{ !inputs.registry_only }}
        run: pnpm run build

      - name: Test
        if: ${{ !inputs.registry_only }}
        run: pnpm test

      # pnpm pack runs prepack (the minified production build) and replaces
      # the workspace: ranges; the tarball is what gets published
      - name: Pack
        id: pack
        if: ${{ !inputs.registry_only }}
        working-directory: packages/cli
        run: |
          pnpm pack
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      # The package as a user gets it: installed from the tarball, its
      # dependencies from the registry, run on the examples
      - name: Try the package
        if: ${{ !inputs.registry_only }}
        run: |
          npm install -g ./packages/cli/eligian-*.tgz
          eligian --version
          # The published manifest keeps mcpName, which the MCP registry checks
          test "$(node -p "require('$(npm root -g)/eligian/package.json').mcpName")" = io.github.rolandzwaga/eligian
          # As pnpm run check:examples: the error examples are left out, the
          # demo is checked on its own
          eligian check "examples/**/*.eligian" "!examples/libraries/errors/**" "!examples/libraries/nested/cycle-*.eligian" "!examples/demo.eligian" --max-warnings 0
          eligian check examples/demo.eligian --selector-not-in-layout off
          eligian smoke "examples/eligian-tour/*.eligian"
          # The MCP server answers eligian_docs with the docs index (the
          # inspector through npx: the global install has no devDependencies)
          npx -y @modelcontextprotocol/inspector@2.13.0 --cli --method tools/call --tool-name eligian_docs --format json eligian mcp \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s).result;const n=r.structuredContent?.index?.length??0;if(r.isError||n<1){console.error('eligian_docs: '+s.slice(0,500));process.exit(1)}console.log('eligian_docs: '+n+' index entries')})"

      - name: Install mcp-publisher
        # Pinned release; the checksum is registry_1.8.7_checksums.txt's line for this archive.
        # Upgrade: change the tag in the URL and the checksum together.
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output mcp-publisher_linux_amd64.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz
          echo "00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579  mcp-publisher_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate server.json
        working-directory: packages/cli
        run: mcp-publisher validate

      - name: Publish
        if: ${{ !inputs.registry_only }}
        working-directory: packages/cli
        run: npm publish ./eligian-*.tgz

      - name: Publish to the MCP registry
        working-directory: packages/cli
        # npm may not serve the new version for a while after `npm publish`, and the registry
        # checks mcpName against npm: retry for up to 6 × 30 s = 180 s. If it still fails, npm has
        # the version already: re-run this workflow with registry_only = true.
        run: |
          attempts=6
          for i in $(seq 1 "$attempts"); do
            mcp-publisher login github-oidc
            if mcp-publisher publish; then exit 0; fi
            if [ "$i" -lt "$attempts" ]; then sleep 30; fi
          done
          echo "::error::mcp-publisher publish failed $attempts times; npm has the version: re-run with registry_only" >&2
          exit 1

      # The tarball npm got, for the GitHub Release
      - name: Keep the tarball
        if: ${{ !inputs.registry_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eligian-tarball
          path: packages/cli/eligian-*.tgz
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: publish
    if: ${{ !inputs.registry_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      # Create the cli-v<version> tag and the release
      contents: write

    steps:
      - name: Get the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eligian-tarball

      # Notes: where to get it, then the pull requests since the previous CLI
      # release (none before the first one)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          previous=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^cli-v' | head -n 1 || true)
          cat > notes.md <<EOF
          The \`eligian\` command, version $VERSION, on npm: https://www.npmjs.com/package/eligian/v/$VERSION

          \`\`\`bash
          npm install -g eligian@$VERSION
          \`\`\`

          Changes: [CHANGELOG.md](https://github.com/$GH_REPO/blob/cli-v$VERSION/CHANGELOG.md)
          EOF
          generated=()
          if [ -n "$previous" ]; then
            generated=(--generate-notes --notes-start-tag "$previous")
          fi
          gh release create "cli-v$VERSION" eligian-*.tgz \
            --target "$GITHUB_SHA" \
            --title "eligian CLI $VERSION" \
            --notes-file notes.md \
            "${generated[@]}"

name: Publish extension

# Publishes the VS Code extension (packages/extension) to the Visual Studio
# Marketplace with Trusted Publishing: GitHub's OIDC token is exchanged for a
# short-lived Marketplace credential, so no access token is stored anywhere.
# The Marketplace policy names this repository and this file (publish.yml),
# without an environment: renaming the file breaks publishing.
#
# Run it by hand from the Actions tab, on main. The version is the one in
# packages/extension/package.json; bump it there first (a version can be
# published once, and a pre-release needs a different version than the next
# regular release).
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish as a pre-release (only users who opt in get it)'
        type: boolean
        default: false

permissions:
  contents: read

# Never two publishes at once
concurrency:
  group: publish-extension
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to the Marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only what is on main gets published
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      # Trusted Publishing: the OIDC token vsce exchanges for a Marketplace credential
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The extension bundles the language package's build output
      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      # vsce runs vscode:prepublish (the minified production build) and packs
      # the allow-listed files (.vscodeignore)
      - name: Publish
        working-directory: packages/extension
        env:
          PRE_RELEASE: ${{ inputs.prerelease && '--pre-release' || '' }}
        run: pnpm exec vsce publish --oidc --no-dependencies $PRE_RELEASE

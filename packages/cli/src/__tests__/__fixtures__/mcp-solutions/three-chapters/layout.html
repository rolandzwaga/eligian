<div id="stage">
  <section id="hub" class="view">
    <h1 id="hub-title" class="title"></h1>
    <div class="cards">
      <button id="to-problem" class="card">Problem</button>
      <button id="to-solution" class="card">Solution</button>
      <button id="to-results" class="card">Results</button>
    </div>
    <div class="languages">
      <button id="lang-nl">Nederlands</button>
      <button id="lang-en">English</button>
    </div>
  </section>

  <section id="problem" class="view">
    <h1 id="problem-title" class="title beat"></h1>
    <p id="problem-text" class="beat"></p>
    <div class="controls"><button id="back-problem">Back</button></div>
  </section>

  <section id="solution" class="view">
    <h1 id="solution-title" class="title beat"></h1>
    <p id="solution-text" class="beat"></p>
    <div class="controls"><button id="back-solution">Back</button></div>
  </section>

  <section id="results" class="view">
    <h1 id="results-title" class="title beat"></h1>
    <p id="results-text" class="beat"></p>
    <div class="controls"><button id="back-results">Back</button></div>
  </section>
</div>
